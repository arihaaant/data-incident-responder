version: 2

# every staging model has an enforced contract: if a source column changes type, the build stops
# with a clear error instead of passing the wrong type downstream.

models:
  - name: stg_regions
    config:
      contract: {enforced: true}
    columns:
      - {name: region_key, data_type: integer}
      - {name: region_name, data_type: varchar}

  - name: stg_nations
    config:
      contract: {enforced: true}
    columns:
      - {name: nation_key, data_type: integer}
      - {name: nation_name, data_type: varchar}
      - {name: region_key, data_type: integer}

  - name: stg_customers
    config:
      contract: {enforced: true}
    columns:
      - name: customer_key
        data_type: bigint
        data_tests: [unique, not_null]
      - {name: customer_name, data_type: varchar}
      - {name: address, data_type: varchar}
      - {name: phone, data_type: varchar}
      - name: nation_key
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_nations')
                field: nation_key
      - name: market_segment
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [AUTOMOBILE, BUILDING, FURNITURE, HOUSEHOLD, MACHINERY]
      - {name: account_balance, data_type: "decimal(15,2)"}

  - name: stg_parts
    config:
      contract: {enforced: true}
    columns:
      - {name: part_key, data_type: bigint}
      - {name: part_name, data_type: varchar}
      - {name: brand, data_type: varchar}
      - {name: part_type, data_type: varchar}
      - {name: retail_price, data_type: "decimal(15,2)"}

  - name: stg_orders
    config:
      contract: {enforced: true}
    columns:
      - name: order_key
        data_type: bigint
        data_tests: [unique, not_null]
      - name: customer_key
        data_type: bigint
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_key
      - name: order_status
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: [F, O, P]
      - {name: total_price, data_type: "decimal(15,2)"}
      - name: order_date
        data_type: date
        data_tests: [not_null]
      - {name: priority, data_type: varchar}
      - {name: loaded_at, data_type: timestamp}

  - name: stg_lineitem
    config:
      contract: {enforced: true}
    columns:
      - name: order_line_id
        data_type: varchar
        data_tests: [unique, not_null]
      - name: order_key
        data_type: bigint
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_key
      - {name: line_number, data_type: bigint}
      - {name: part_key, data_type: bigint}
      - {name: supplier_key, data_type: bigint}
      - {name: quantity, data_type: "decimal(15,2)"}
      - name: extended_price
        data_type: "decimal(15,2)"
        data_tests: [not_null]
      - name: discount
        data_type: "decimal(15,2)"
        data_tests: [not_null]
      - {name: tax, data_type: "decimal(15,2)"}
      - {name: return_flag, data_type: varchar}
      - {name: ship_date, data_type: date}
      - {name: net_revenue, data_type: "decimal(18,4)"}
