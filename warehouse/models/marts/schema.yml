version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
      - name: region_name
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [AFRICA, AMERICA, ASIA, EUROPE, MIDDLE EAST]

  - name: fct_order_items
    columns:
      - name: order_line_id
        data_tests: [unique, not_null]

  - name: fct_orders
    columns:
      - name: order_key
        data_tests: [unique, not_null]
      - name: region_name
        data_tests: [not_null]
      - name: net_revenue
        data_tests: [not_null]

  - name: fct_daily_revenue
    columns:
      - name: order_date
        data_tests: [not_null]
