[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "responder"
version = "0.1.0"
description = "Multi-agent responder for data incidents in a dbt + DuckDB warehouse."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "sqlglot>=25",
    "mcp[cli]>=1.24,<2",
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-mcp-adapters>=0.3",
    "langfuse>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
